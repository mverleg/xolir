
syntax = "proto3";
package xolir;
option java_package = "com.apivolve.xolir";

import "xolir/expression.proto";
import "xolir/refs.proto";

// Top-level executable entry point. Behaves like a function with no args
// that implicitly returns an integer exit code. Cannot be called from
// other functions. Names must be unique across binaries.
message Binary {
  string name = 1;
  string description = 2;
  repeated TypedName locals = 3;
  repeated Expression code = 4;
}
